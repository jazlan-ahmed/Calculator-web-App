<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator - Single Page Web App</title>
  <meta name="description" content="A feature-rich, beautiful, responsive single-page calculator web application with basic and scientific operations, history, and theme switching.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="app-container">
    <div class="welcome-banner">
      <h2>Welcome to CalcX!</h2>
      <div class="banner-actions">
        <button id="toggle-mode-btn" class="icon-btn" title="Toggle Scientific Mode" aria-label="Toggle Scientific Mode">
          <span class="mode-badge">SCI</span>
        </button>
        <button id="toggle-history-btn" class="icon-btn" title="History Log" aria-label="Toggle History">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
        <button id="toggle-theme-btn" class="icon-btn" title="Switch Theme" aria-label="Switch Theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <main class="calculator-card">
      <!-- Display Screen -->
      <section class="display-container">
        <div class="expression-line" id="expression-display" aria-live="polite"></div>
        <div class="result-line" id="result-display">0</div>
        <div class="memory-badge-row">
          <span class="memory-indicator hidden" id="memory-indicator">M</span>
          <span class="deg-rad-indicator" id="angle-unit-toggle" title="Click to switch DEG/RAD">DEG</span>
        </div>
      </section>

      <!-- Keypad Section -->
      <section class="keypad-container">
        <!-- Scientific Panel (Collapsible / Toggleable) -->
        <div class="scientific-panel hidden" id="scientific-panel">
          <button class="btn btn-sci" data-action="sin">sin</button>
          <button class="btn btn-sci" data-action="cos">cos</button>
          <button class="btn btn-sci" data-action="tan">tan</button>
          <button class="btn btn-sci" data-action="log">log</button>
          <button class="btn btn-sci" data-action="ln">ln</button>

          <button class="btn btn-sci" data-action="sqrt">√</button>
          <button class="btn btn-sci" data-action="pow">x^y</button>
          <button class="btn btn-sci" data-action="sqr">x²</button>
          <button class="btn btn-sci" data-action="pi">π</button>
          <button class="btn btn-sci" data-action="e">e</button>

          <button class="btn btn-sci" data-action="fact">n!</button>
          <button class="btn btn-sci" data-action="inv">1/x</button>
          <button class="btn btn-sci" data-action="abs">|x|</button>
          <button class="btn btn-sci" data-action="open-paren">(</button>
          <button class="btn btn-sci" data-action="close-paren">)</button>
        </div>

        <!-- Memory Row -->
        <div class="memory-row">
          <button class="btn btn-mem" data-action="mc">MC</button>
          <button class="btn btn-mem" data-action="mr">MR</button>
          <button class="btn btn-mem" data-action="m-add">M+</button>
          <button class="btn btn-mem" data-action="m-sub">M-</button>
          <button class="btn btn-mem" data-action="ms">MS</button>
        </div>

        <!-- Main Standard Keypad Grid -->
        <div class="standard-grid">
          <button class="btn btn-accent" data-action="clear">AC</button>
          <button class="btn btn-secondary" data-action="backspace">⌫</button>
          <button class="btn btn-secondary" data-action="percent">%</button>
          <button class="btn btn-op" data-action="operator" data-val="/">÷</button>

          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-op" data-action="operator" data-val="*">×</button>

          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-op" data-action="operator" data-val="-">−</button>

          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-op" data-action="operator" data-val="+">+</button>

          <button class="btn btn-secondary" data-action="negate">±</button>
          <button class="btn btn-num" data-val="0">0</button>
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>Thanks for choosing CalcX</p>
    </footer>
    <aside class="history-drawer hidden" id="history-drawer">
      <div class="history-header">
        <h3>Calculation History</h3>
        <div class="history-actions">
          <button id="clear-history-btn" class="text-btn">Clear</button>
          <button id="close-history-btn" class="icon-btn">✕</button>
        </div>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history">No history recorded yet</div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
